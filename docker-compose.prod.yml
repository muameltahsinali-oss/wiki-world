# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api-internal:
    image: nginx:1.27-alpine
    container_name: wikiworld-api-internal
    restart: always
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - wikiworld

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      FRONTEND_URL: ${FRONTEND_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
    volumes: []

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
    env_file:
      - ./frontend/.env.local
    command: node server.js
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes: []

  nginx:
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - api-internal
      - frontend

  scheduler:
    restart: always

  worker:
    restart: always
