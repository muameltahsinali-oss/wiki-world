name: wikiworld

services:
  postgres:
    image: postgres:16-alpine
    container_name: wikiworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wikiworld}
      POSTGRES_USER: ${DB_USERNAME:-wikiworld}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wikiworld}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wikiworld
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wikiworld}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wikiworld-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - wikiworld
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: wikiworld-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-wikiworld_dev_key}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - wikiworld
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wikiworld-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-wikiworld}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-wikiworld_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - wikiworld

  mailpit:
    image: axllent/mailpit:latest
    container_name: wikiworld-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - wikiworld

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: wikiworld-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: http://meilisearch:7700
      AWS_ENDPOINT: http://minio:9000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wikiworld

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: wikiworld-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - backend
      - redis
    networks:
      - wikiworld

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: wikiworld-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - backend
    networks:
      - wikiworld

  nginx:
    image: nginx:1.27-alpine
    container_name: wikiworld-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - wikiworld

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: wikiworld-frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${APP_PORT:-8080}/api/v1
    depends_on:
      - nginx
    networks:
      - wikiworld

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
  backend_vendor:
  frontend_node_modules:

networks:
  wikiworld:
    driver: bridge
